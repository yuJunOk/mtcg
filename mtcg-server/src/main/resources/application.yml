server:
  port: 8081
  servlet:
    context-path: /api

spring:
  profiles:
    active: local
  application:
    name: mtcg
  datasource:
    url: jdbc:postgresql://localhost:5432/db_mtcg
    driver-class-name: org.postgresql.Driver
    # 本地凭证请在 application-local.yml 或环境变量中配置，参见 application-local.yml.example
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/init-schema.sql,classpath:sql/init-data.sql
      continue-on-error: true
      encoding: UTF-8
  web:
    resources:
      static-locations:
        - classpath:/static/

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    print-banner: false

logging:
  level:
    com.aris.mtcg: INFO

mtcg:
  jwt:
    # 必须通过 application-local.yml 或环境变量 MTCG_JWT_SECRET 提供（至少 32 字符）
    secret: ${MTCG_JWT_SECRET:}
    # 访问令牌有效期（分钟）
    expire-minutes: 120
    # 刷新令牌有效期（天）
    refresh-expire-days: 7
    header: Authorization
    token-prefix: "Bearer "

# 文件：上传目录 + 卡面素材目录（image_path 相对路径经 /files/** 访问）
file:
  upload:
    base-path: ./uploads
    image-suffixes: .jpg,.jpeg,.png,.gif,.webp
    max-size: 5242880
  assets:
    # 仓库 assets/（内含 card/faces/{产品}/{card_code}.png）
    # 默认相对 mtcg-server 启动目录；可用绝对路径覆盖
    base-path: ../assets
