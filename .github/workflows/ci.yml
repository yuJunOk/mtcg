name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    name: Backend (compile + test + spotless)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mtcg-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Spotless check
        run: chmod +x ./mvnw && ./mvnw -B spotless:check
      - name: Unit tests
        run: ./mvnw -B test -Dtest='!*IT'

  frontend:
    name: Admin Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mtcg-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mtcg-client/package-lock.json
      - name: Install
        run: npm ci
      - name: Build admin-web
        run: npm run build:admin
